server:
  port: 8080

spring:
  application:
    name: webhookpilot

  datasource:
    url: jdbc:postgresql://localhost:5433/webhookpilot
    username: webhookpilot
    password: webhookpilot
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false              # turned off — structured logging replaces SQL debug output
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: webhookpilot-delivery
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: "webhook-pilot-dev-secret-key-change-in-production-must-be-at-least-256-bits"
    expiration-ms: 86400000

  delivery:
    max-attempts: 6
    backoff-seconds: 10,30,60,300,900
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    retry-poll-interval-ms: 10000

  circuit-breaker:
    failure-threshold: 5          # consecutive failures before circuit opens
    cooldown-seconds: 60          # how long circuit stays open before half-open probe

  rate-limit:
    max-events-per-minute: 100    # per application
