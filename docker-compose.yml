version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: webhookpilot-postgres
    environment:
      POSTGRES_DB: webhookpilot
      POSTGRES_USER: webhookpilot
      POSTGRES_PASSWORD: webhookpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis — needed from Phase 3 (circuit breaker state, rate limiting)
  redis:
    image: redis:7-alpine
    container_name: webhookpilot-redis
    ports:
      - "6379:6379"
    profiles:
      - full

  # Kafka (KRaft mode, no Zookeeper) — needed from Phase 2
  kafka:
    image: apache/kafka:3.7.0
    container_name: webhookpilot-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "webhookpilot-local-dev-001"
    ports:
      - "9092:9092"
    profiles:
      - full

volumes:
  pgdata:
